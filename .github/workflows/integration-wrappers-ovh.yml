name: OVH wrapper integration tests

on:
  pull_request_target:
    paths:
      - 'wrappers/ovhcloudkms/**'
      - '*'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: integration
      deployment: false
    permissions:
      contents: read

    steps:
      - name: Setup wrapper integration test
        uses: ./.github/actions/setup-unsafe-integration-test
        with:
          module: ./wrappers/ovhcloudkms

      - name: Get OVH access token
        id: token
        env:
          client_id: ${{ secrets.OVHCLOUDKMS_SERVICE_ACCOUNT_NAME }}
          client_secret: ${{ secrets.OVHCLOUDKMS_SERVICE_ACCOUNT_PASSWORD }}
        run: |
          TOKEN=$(curl -f -s -X POST \
            --url 'https://www.ovh.com/auth/oauth2/token' \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data grant_type=client_credentials \
            --data client_id="$client_id" \
            --data client_secret="$client_secret" \
            --data scope=all | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to retrieve OVH access token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >>"$GITHUB_OUTPUT"

      - name: Run integration tests
        working-directory: ./wrappers/ovhcloudkms
        env:
          KMS_ACC_TESTS: "true"
          OVHCLOUDKMS_KEY_ID: ${{ secrets.OVHCLOUDKMS_KEY_ID }}
          OVHCLOUDKMS_ENDPOINT: ${{ secrets.OVHCLOUDKMS_ENDPOINT }}
          OVHCLOUDKMS_ID: ${{ secrets.OVHCLOUDKMS_ID }}
          OVHCLOUDKMS_CERT_CLIENT_CERT: ${{ secrets.OVHCLOUDKMS_CERT_CLIENT_CERT }}
          OVHCLOUDKMS_CERT_CLIENT_KEY: ${{ secrets.OVHCLOUDKMS_CERT_CLIENT_KEY }}
          OVHCLOUDKMS_TOKEN: ${{ steps.token.outputs.token }}
        run: go test ./...
